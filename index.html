<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafetería Aroma de Café</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    </head>
<body>

    <header id="inicio">
        <div class="container">
            <h1>Cafetería Aroma de Café</h1>
            <p class="lead">El mejor café y ambiente acogedor.</p>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">☕ Aroma de Café</a>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section id="contacto" class="container my-5">
            <h2 class="text-center">Registro de Solicitudes</h2>
            <div class="row">
                <div class="col-md-6">
                    <form id="formSolicitud" novalidate>
                        <div class="mb-3">
                            <label>Nombre</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Producto</label>
                            <input type="text" id="producto" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrar</button>
                    </form>
                </div>
                
                <div class="col-md-6">
                    <h4>Solicitudes</h4>
                    <div id="listaSolicitudes">
                        </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Shirley Mileni Peñarreta Montenegro | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
